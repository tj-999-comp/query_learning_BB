name: Request publish

on:
  push:
    branches: [main]
    paths:
      - work-records/md/work_record_*.md
      - work-records/metadata/work_record_*.yml
  workflow_dispatch:
    inputs:
      target_basename:
        description: Numbered basename, for example work_record_001
        required: true
        type: string
      notify:
        description: Send Slack notifications for this publish request
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fixed source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source
        run: python3 scripts/dev/validate_work_records.py
      - name: Resolve target basenames
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BASENAME: ${{ inputs.target_basename }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidates=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            candidates=("$TARGET_BASENAME")
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git ls-files 'work-records/md/work_record_*.md' 'work-records/metadata/work_record_*.yml')"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            fi
            mapfile -t candidates < <(
              printf '%s\n' "$changed_files" \
                | sed -nE 's#^work-records/(md|metadata)/(work_record_[0-9]{3})\.(md|yml)$#\2#p' \
                | sort -u
            )
          fi

          targets_file="$RUNNER_TEMP/work-record-targets"
          : > "$targets_file"
          for basename in "${candidates[@]}"; do
            [[ "$basename" =~ ^work_record_[0-9]{3}$ ]]
            test -f "work-records/md/$basename.md"
            test -f "work-records/metadata/$basename.yml"
            rg -q '^publish: true$' "work-records/metadata/$basename.yml"
            echo "$basename" >> "$targets_file"
          done
          test -s "$targets_file"
          printf 'targets_file=%s\n' "$targets_file" >> "$GITHUB_OUTPUT"

      - name: Check target basenames
        env:
          TARGETS_FILE: ${{ steps.targets.outputs.targets_file }}
        run: |
          set -euo pipefail
          test -s "$TARGETS_FILE"
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: tj-999-comp
          repositories: sandbox-pages
          permission-actions: write
      - name: Dispatch Repository A acceptance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_ID: query_learning_BB
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          TARGETS_FILE: ${{ steps.targets.outputs.targets_file }}
          REQUEST_NOTIFY: ${{ inputs.notify }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "query_learning_BB"
          notify="${REQUEST_NOTIFY:-true}"
          while IFS= read -r target_basename; do
            gh workflow run accept-source.yml \
              --repo tj-999-comp/sandbox-pages \
              --ref main \
              -f project_id="$PROJECT_ID" \
              -f source_commit_sha="$SOURCE_COMMIT_SHA" \
              -f target_basename="$target_basename" \
              -f notify="$notify"
          done < "$TARGETS_FILE"
